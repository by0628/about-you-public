<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>认知棱镜 · 内在光谱</title>
    <style>
        :root {
            --bg: #f5f3ee;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.6);
            --text-main: #2d2a24;
            --text-sub: #7b7466;
            --border: #e8e3dc;
            --primary: #7b8d9e;
            --primary-light: #a0b0c0;
            --accent: #c9b18a;
            --shadow: 0 10px 40px rgba(123, 141, 158, 0.08);
            --radius-lg: 32px;
            --radius-md: 24px;
            --radius-sm: 16px;
            --transition: 0.4s cubic-bezier(.4, 0, .2, 1);
        }
        html.dark-mode {
            --bg: #1a1a2e;
            --bg-card: #24243e;
            --bg-glass: rgba(36, 36, 62, 0.6);
            --text-main: #eae6e0;
            --text-sub: #9b9588;
            --border: #33334d;
            --primary: #9bb0c0;
            --primary-light: #7b8d9e;
            --accent: #c9b18a;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            transition: background var(--transition), color var(--transition);
        }
        .app-container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 36px 40px 60px;
            position: relative;
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo svg {
            width: 32px;
            height: 32px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-sub);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .theme-toggle:hover {
            transform: translateY(-2px);
            color: var(--primary);
        }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .btn {
            padding: 12px 26px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            box-shadow: 0 8px 20px rgba(123, 141, 158, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-sub);
        }
        .btn-outline:hover {
            background: var(--bg);
            border-color: var(--primary-light);
        }
        .btn-full {
            width: 100%;
            justify-content: center;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }
        .page {
            display: none;
            animation: fadeIn .5s ease forwards;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
            to {
                opacity: 1;
                transform: none
            }
        }

        .home-title {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .home-sub {
            font-size: 16px;
            color: var(--text-sub);
            margin: 16px 0 32px;
            border-left: 4px solid var(--accent);
            padding-left: 20px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }
        .test-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .test-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(123, 141, 158, 0.1);
            border-color: var(--primary-light);
        }
        .test-card .icon {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            stroke: var(--primary);
            stroke-width: 1.8;
            fill: none;
        }
        .test-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .test-card p {
            color: var(--text-sub);
            font-size: 12px;
            line-height: 1.4;
        }
        .test-card .badge {
            font-size: 11px;
            background: var(--bg);
            border-radius: 12px;
            padding: 2px 10px;
            display: inline-block;
            margin-top: 6px;
            color: var(--text-sub);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--bg);
            border-radius: 999px;
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 999px;
            transition: width .4s ease;
            width: 0%;
        }
        .question-box {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 36px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }
        .q-counter {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 12px;
            display: block;
        }
        .q-text {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.6;
        }
        .q-scenario {
            font-size: 14px;
            color: var(--text-sub);
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            margin: 14px 0 18px;
            border-left: 4px solid var(--accent);
            line-height: 1.6;
            font-weight: 400;
            display: none;
        }
        .options-container {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-item {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            font-size: 15px;
        }
        .option-item:hover {
            border-color: var(--primary-light);
            background: var(--bg-card);
            transform: translateX(4px);
        }
        .option-item.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(123, 141, 158, 0.1), rgba(201, 177, 138, 0.05));
        }
        .option-item .key-hint {
            font-size: 11px;
            color: var(--text-sub);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            margin-left: auto;
        }

        .result-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(123, 141, 158, 0.12);
            text-align: center;
            border: 1px solid var(--border);
        }
        .result-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 12px;
            stroke: var(--primary);
            stroke-width: 1.5;
            fill: none;
        }
        .result-type {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .result-desc {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.8;
            max-width: 600px;
            margin: 16px auto 0;
        }
        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 24px;
        }
        .dim-tag {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: var(--text-main);
            text-align: left;
        }
        .dim-tag .dim-name {
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-bottom: 2px;
        }

        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-mask.show {
            display: flex;
            animation: fadeIn .3s ease;
        }
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 28px;
            max-width: 600px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .modal h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item .hist-type {
            font-weight: 700;
            color: var(--primary);
        }
        .history-item .hist-time {
            font-size: 11px;
            color: var(--text-sub);
        }
        .history-item .hist-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .history-item .hist-dims {
            font-size: 11px;
            color: var(--text-sub);
            width: 100%;
            margin-top: 4px;
        }

        @media(max-width:640px) {
            .app-container {
                padding: 20px;
                border-radius: 24px;
            }
            .home-title {
                font-size: 28px;
            }
            .question-box {
                padding: 24px;
            }
            .q-text {
                font-size: 17px;
            }
            .q-scenario {
                font-size: 13px;
                padding: 12px 14px;
            }
            .modal {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 32 32"><path d="M16 4 L16 28 M4 16 L28 16 M8 8 L24 24 M24 8 L8 24" stroke-linecap="round"/></svg>
                <span>认知棱镜</span>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" onclick="showHistory()" title="历史记录">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2 L8 6 M16 2 L16 6 M3 10 L21 10"/></svg>
                </button>
                <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切换主题">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2 L12 4 M12 20 L12 22 M4 12 L2 12 M22 12 L20 12 M5.6 5.6 L4.2 4.2 M18.4 18.4 L19.8 19.8 M18.4 5.6 L19.8 4.2 M5.6 18.4 L4.2 19.8"/></svg>
                </button>
            </div>
        </header>

        <div class="page active" id="page-home">
            <h1 class="home-title">认知 · 情感 · 行为</h1>
            <div class="home-sub">基于心理学原理的自我探索工具，所有数据仅保存在本地，不传输、不追踪。</div>
            <div class="test-grid" id="testGrid"></div>
        </div>

        <div class="page" id="page-quiz">
            <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
            <div class="question-box">
                <span class="q-counter" id="qCounter"></span>
                <div class="q-text" id="qText"></div>
                <div class="q-scenario" id="qScenario"></div>
                <div class="options-container" id="optionsContainer"></div>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="prevQuestion()" id="prevBtn" style="display:none;">← 上一题</button>
                <button class="btn btn-outline" onclick="goHome()" id="homeBtn">← 返回</button>
                <button class="btn btn-primary btn-full" id="nextBtn" onclick="nextQuestion()" disabled>确认选择</button>
            </div>
        </div>

        <div class="page" id="page-result">
            <div class="result-card" id="resultCard">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-type" id="resultType"></div>
                <div class="result-desc" id="resultDesc"></div>
                <div class="dimension-grid" id="dimGrid"></div>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-primary btn-full" onclick="shareResult()">📸 生成分享图</button>
                <button class="btn btn-outline" onclick="goHome()">返回首页</button>
                <button class="btn btn-outline" onclick="restartCurrentTest()">重新测试</button>
            </div>
        </div>
    </div>

    <div class="modal-mask" id="historyModal" onclick="if(event.target===this)this.classList.remove('show')">
        <div class="modal">
            <h3>📋 历史记录</h3>
            <div id="historyList"><p style="color:var(--text-sub);font-size:14px;">暂无记录</p></div>
        </div>
    </div>

    <!-- 3倍高清画布 -->
    <canvas id="shareCanvas" width="2400" height="3000" style="display:none;"></canvas>

    <script>
        // 主题
        (function() {
            const t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.getElementById('html-root').classList.add('dark-mode');
            }
        })();

        function toggleTheme() {
            const html = document.getElementById('html-root');
            html.classList.toggle('dark-mode');
            localStorage.setItem('theme', html.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        // ─── 测试数据（完整保留所有情景题） ──────────────────────────
        const TESTS = [{
            id: 'sbti',
            name: 'SBTI 性格侧写',
            icon: `<svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="3" stroke="currentColor"/><path d="M12 15 L28 15 M12 20 L24 20 M12 25 L20 25" stroke="currentColor"/></svg>`,
            desc: '60+现实情景题，覆盖15个心理维度，精准定位你的内在原型。',
            questions: [
                // S1 自我评价
                { id: 'S1a', text: '项目庆功宴上，CEO公开夸你是“天才”，但你清楚数据有个小错误。你如何回应？',
                    options: ['大方接受，认为实力配得上', '谦虚归功于团队，淡化自己', '当场解释数据背景，强调运气'] },
                { id: 'S1b', text: '你和伴侣大吵一架，对方摔门而出，深夜未归。你的第一反应是？', options: ['主动打电话求和，担心安全',
                        '自己先睡，等对方冷静回来再说', '觉得对方无理取闹，继续做自己的事'
                    ] },
                { id: 'S1c', text: '深夜复盘白天的失误，你的心理状态通常是？', options: ['很快放下，谁都会犯错', '反复回想，内耗到失眠',
                        '客观记录原因，明天改进'
                    ] },
                { id: 'S1d', text: '被心仪的公司/学校拒绝后，你的内心独白是？', options: ['“他们不识货，我再找更好的”',
                        '“我是不是真的不够好”', '“可能只是不匹配，继续投”'
                    ] },
                // S2
                { id: 'S2a', text: '突然获得一笔100万的意外之财，你最想用来做什么？', options: ['辞职创业或环球旅行（追求自由）',
                        '买课学习或深度投资自己（追求真实成长）', '买房买车或存定期（追求稳定）'
                    ] },
                { id: 'S2b', text: '朋友当众开了一个让你难堪的玩笑，全场哄笑。你会？', options: ['当场笑着怼回去，化解尴尬', '表面笑笑，但心里记很久',
                        '觉得无所谓，就是玩笑'
                    ] },
                { id: 'S2c', text: '你理想中的“成功”更接近哪一种画面？', options: ['在自己热爱的领域做到极致', '拥有随时说“不”的选择权',
                        '被家人和圈子高度认可'
                    ] },
                { id: 'S2d', text: '长辈劝你考公务员求稳定，而你有自己的创业想法。你更倾向于？', options: ['坚持自己的想法，哪怕冒险',
                        '听取意见，先求稳定再发展', '折中，找一份体制内清闲工作同时搞副业'
                    ] },
                // S3
                { id: 'S3a', text: '你对自己未来五年的规划清晰程度是？', options: ['非常清晰，有详细步骤', '大致有方向，但细节模糊', '完全随缘，走一步看一步'] },
                { id: 'S3b', text: '你更相信“性格决定命运”还是“选择改变人生”？', options: ['选择改变人生（相信能动性）', '两者各占一半',
                        '命运主导一切（相信宿命）'
                    ] },
                { id: 'S3c', text: '你觉得自己身上最宝贵的特质是？', options: ['果敢无畏的行动力', '深邃敏锐的洞察力', '温暖包容的共情力'] },
                { id: 'S3d', text: '参加一个深度心理工作坊，导师让你用三个词定义自己。你更倾向于用？', options: ['进取、果断、独立', '细腻、矛盾、清醒',
                        '随和、适应、乐观'
                    ] },
                // E1
                { id: 'E1a', text: '在一段关系中，你通常如何确认“对方还在乎我”？', options: ['几乎不确认，安全感自给自足', '偶尔通过小事默默观察',
                        '经常需要对方明确表达或反复确认'
                    ] },
                { id: 'E1b', text: '你表达负面情绪（如愤怒、悲伤）的方式更接近？', options: ['直接当面说出来', '写日记或通过艺术表达',
                        '不表达，等对方自己察觉'
                    ] },
                { id: 'E1c', text: '凌晨朋友发来长消息崩溃倾诉，你更倾向于？', options: ['安静陪伴，不急于给建议', '立刻分析问题，给出一套解决方案',
                        '感到压力，不知如何回应'
                    ] },
                { id: 'E1d', text: '收到一份意料之外的用心礼物，你的第一反应是？', options: ['热情拥抱并直接表达喜悦', '内心感动但表面平静，事后道谢',
                        '有些不知所措，想着该怎么还礼'
                    ] },
                // E2
                { id: 'E2a', text: '你更容易因为哪种情境而忍不住落泪？', options: ['被他人深刻理解和看见', '被误解或感到委屈', '看到感人的新闻或影视作品'] },
                { id: 'E2b', text: '你会在社交媒体上发布自己的负面情绪吗？', options: ['从不，只发积极内容', '偶尔设置分组可见', '经常，想获得关注和安慰'] },
                { id: 'E2c', text: '你理想中的亲密关系状态更接近？', options: ['彼此独立但保持深度连接', '形影不离，高度融合', '互不打扰，各忙各的'] },
                { id: 'E2d', text: '当伴侣忘记某个对你很重要的纪念日，你的内心感受是？', options: ['失望，但会直接沟通需求', '失落但不提，默默扣分',
                        '觉得无所谓，形式不重要'
                    ] },
                // E3
                { id: 'E3a', text: '当别人在公开场合对你发火指责时，你的本能反应是？', options: ['保持冷静，就事论事反驳', '感到受伤，沉默不语或离场',
                        '被激怒，以牙还牙怼回去'

            const hasScenario = q.text.includes('聚会') || q.text.includes('公司') || q.text.includes('伴侣') ||
                q.text.includes('朋友') || q.text.includes('老板') || q.text.includes('深夜') ||
                q.text.includes('周末') || q.text.includes('压力') || q.text.includes('项目');
            if (hasScenario) {
                scenarioEl.style.display = 'block';
                let label = '📌 现实情境';
                if (q.text.includes('公司') || q.text.includes('项目') || q.text.includes('老板')) label = '💼 职场情境';
                else if (q.text.includes('伴侣') || q.text.includes('关系') || q.text.includes('约会')) label = '❤️ 关系情境';
                else if (q.text.includes('朋友') || q.text.includes('聚会') || q.text.includes('社交')) label = '👥 社交情境';
                else if (q.text.includes('深夜') || q.text.includes('压力') || q.text.includes('独处')) label = '🌙 内心情境';
                scenarioEl.textContent = `${label}  ·  请凭第一直觉选择`;
            } else {
                scenarioEl.style.display = 'none';
            }

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option-item';
                const isSelected = answers[currentQ] && answers[currentQ].value === i;
                if (isSelected) div.classList.add('selected');
                div.innerHTML =
                    `<span>${String.fromCharCode(65+i)}. ${opt}</span><span class="key-hint">${i+1}</span>`;
                div.onclick = () => selectOption(div, i);
                container.appendChild(div);
            });
            selectedValue = answers[currentQ] ? answers[currentQ].value : null;
            document.getElementById('nextBtn').disabled = selectedValue === null;
            updateNavButtons();
        }

        function selectOption(el, val) {
            if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null; }
            document.querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            selectedValue = val;
            document.getElementById('nextBtn').disabled = false;

            if (currentQ < activeTest.questions.length - 1) {
                autoAdvanceTimer = setTimeout(() => { nextQuestion(); }, 600);
            }
        }

        function prevQuestion() {
            if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null; }
            if (currentQ <= 0) return;
            currentQ--;
            selectedValue = null;
            renderQuestion();
        }

        function nextQuestion() {
            if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null; }
            if (selectedValue === null) return;
            const q = activeTest.questions[currentQ];
            const qid = q.id || `q${currentQ}`;
            answers[currentQ] = { qid, value: selectedValue };
            currentQ++;
            selectedValue = null;
            if (currentQ >= activeTest.questions.length) { finishTest(); return; }
            renderQuestion();
        }

        // ─── 完成测试 ──────────────────────────────────────────────
        function finishTest() {
            const result = activeTest.getResult(answers);
            result.testName = activeTest.name;
            result.testIcon = activeTest.icon;
            resultData = result;
            showPage('page-result');
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('resultIcon').innerHTML =
                `<svg viewBox="0 0 80 80" stroke="var(--primary)" stroke-width="2" fill="none"><circle cx="40" cy="40" r="30"/><path d="M20 40 L60 40 M40 20 L40 60"/></svg>`;
            document.getElementById('resultType').textContent = result.type;
            document.getElementById('resultDesc').textContent = result.description || '';
            const grid = document.getElementById('dimGrid');
            grid.innerHTML = '';
            if (result.dims && Object.keys(result.dims).length > 0) {
                grid.style.display = 'grid';
                Object.entries(result.dims).forEach(([k, v]) => {
                    const div = document.createElement('div');
                    div.className = 'dim-tag';
                    div.innerHTML = `<span class="dim-name">${k}</span>${v}`;
                    grid.appendChild(div);
                });
            } else grid.style.display = 'none';
            saveHistory(result);
        }

        // ─── 历史记录 ──────────────────────────────────────────────
        function saveHistory(data) {
            const key = 'aurevny_multi_test_history';
            const hist = JSON.parse(localStorage.getItem(key) || '[]');
            hist.unshift({
                testName: data.testName,
                testIcon: data.testIcon,
                type: data.type,
                description: data.description,
                dims: data.dims || null,
                date: new Date().toLocaleString('zh-CN')
            });
            localStorage.setItem(key, JSON.stringify(hist.slice(0, 30)));
        }

        function showHistory() {
            const key = 'aurevny_multi_test_history';
            const hist = JSON.parse(localStorage.getItem(key) || '[]');
            const list = document.getElementById('historyList');
            if (hist.length === 0) {
                list.innerHTML = '<p style="color:var(--text-sub);font-size:14px;">暂无记录</p>';
            } else {
                list.innerHTML = hist.map((h, idx) => {
                    const dimsStr = h.dims ? Object.entries(h.dims).map(([k, v]) => `${k}:${v}`).join(' · ') :
                        '';
                    return `<div class="history-item">
                        <div style="flex:1; min-width:150px;">
                            <span class="hist-type">${h.testName} · ${h.type}</span>
                            <div class="hist-time">${h.date}</div>
                            ${dimsStr ? `<div class="hist-dims">${dimsStr}</div>` : ''}
                        </div>
                        <div class="hist-actions">
                            <button class="btn btn-primary btn-sm" onclick="regenHistory(${idx})">📸 重新生成</button>
                        </div>
                    </div>`;
                }).join('');
            }
            document.getElementById('historyModal').classList.add('show');
        }

        // ─── 从历史记录重新生成图片 ──────────────────────────────
        function regenHistory(index) {
            const key = 'aurevny_multi_test_history';
            const hist = JSON.parse(localStorage.getItem(key) || '[]');
            if (index >= hist.length || index < 0) return;
            const record = hist[index];
            // 构造与 resultData 相同的结构
            const data = {
                testName: record.testName,
                type: record.type,
                description: record.description || '',
                dims: record.dims || null
            };
            shareResultWithData(data);
        }

        // ─── 核心分享图绘制（3倍高清） ────────────────────────────
        function drawRoundRect(ctx, x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
        }

        function shareResultWithData(data) {
            if (!data) return;
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            const isDark = document.getElementById('html-root').classList.contains('dark-mode');
            // 缩放因子 3 倍
            const S = 3;
            const W = 800 * S,
                H = 1000 * S;
            canvas.width = W;
            canvas.height = H;
            // 清空
            ctx.clearRect(0, 0, W, H);
            // 背景
            ctx.fillStyle = isDark ? '#1a1a2e' : '#f5f3ee';
            ctx.fillRect(0, 0, W, H);
            // 卡片
            const margin = 40 * S;
            const cardW = W - 2 * margin;
            const cardH = H - 2 * margin;
            ctx.fillStyle = isDark ? '#24243e' : '#ffffff';
            ctx.beginPath();
            drawRoundRect(ctx, margin, margin, cardW, cardH, 32 * S);
            ctx.fill();

            // 标题
            ctx.fillStyle = isDark ? '#c9b18a' : '#7b8d9e';
            ctx.font = `bold ${34*S}px "Inter","PingFang SC",sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('认知棱镜 · ' + data.testName, W / 2, 70 * S);

            // 图标
            const cx = W / 2,
                cy = 180 * S,
                r = 50 * S;
            ctx.strokeStyle = isDark ? '#c9b18a' : '#7b8d9e';
            ctx.lineWidth = 4 * S;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - r + 10 * S, cy);
            ctx.lineTo(cx + r - 10 * S, cy);
            ctx.moveTo(cx, cy - r + 10 * S);
            ctx.lineTo(cx, cy + r - 10 * S);
            ctx.stroke();

            // 结果类型
            ctx.fillStyle = isDark ? '#eae6e0' : '#2d2a24';
            ctx.font = `bold ${46*S}px "Inter","PingFang SC",sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillText(data.type, W / 2, 250 * S);

            // 描述文本（自动换行）
            ctx.fillStyle = isDark ? '#9b9588' : '#7b7466';
            ctx.font = `${22*S}px "Inter","PingFang SC",sans-serif`;
            ctx.textBaseline = 'top';
            const desc = data.description || '';
            const maxWidth = 620 * S;
            const lineHeight = 38 * S;
            let lines = [];
            let currentLine = '';
            for (let i = 0; i < desc.length; i++) {
                const testLine = currentLine + desc[i];
                if (ctx.measureText(testLine).width > maxWidth && i > 0) {
                    lines.push(currentLine);
                    currentLine = desc[i];
                } else {
                    currentLine = testLine;
                }
            }
            if (currentLine) lines.push(currentLine);
            let yPos = 320 * S;
            lines.forEach(line => {
                ctx.fillText(line, W / 2, yPos);
                yPos += lineHeight;
            });

            // 维度网格
            const dims = data.dims;
            if (dims && Object.keys(dims).length > 0) {
                const entries = Object.entries(dims);
                const cols = 5;
                const itemWidth = 110 * S;
                const itemHeight = 32 * S;
                const gapX = 12 * S,
                    gapY = 10 * S;
                const startX = W / 2 - (cols * (itemWidth + gapX) - gapX) / 2;
                const startY = yPos + 20 * S;

                ctx.font = `${13*S}px "Inter","PingFang SC",monospace`;
                ctx.textBaseline = 'top';
                entries.forEach(([k, v], idx) => {
                    const row = Math.floor(idx / cols);
                    const col = idx % cols;
                    const x = startX + col * (itemWidth + gapX);
                    const y = startY + row * (itemHeight + gapY);
                    // 背景框
                    ctx.fillStyle = isDark ? '#2a2a44' : '#f0ede8';
                    ctx.shadowColor = 'rgba(0,0,0,0.05)';
                    ctx.shadowBlur = 4 * S;
                    ctx.beginPath();
                    drawRoundRect(ctx, x, y, itemWidth, itemHeight, 6 * S);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // 文字
                    ctx.fillStyle = isDark ? '#c9b18a' : '#7b8d9e';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${k}:${v}`, x + itemWidth / 2, y + 8 * S);
                });
                yPos = startY + Math.ceil(entries.length / cols) * (itemHeight + gapY) + 10 * S;
            }

            // 底部脚注
            ctx.fillStyle = isDark ? '#555' : '#bbb';
            ctx.font = `${14*S}px "Inter",sans-serif`;
            ctx.textBaseline = 'bottom';
            ctx.fillText('Local Only · No Telemetry', W / 2, 920 * S);
            ctx.fillText(new Date().toLocaleString('zh-CN'), W / 2, 950 * S);

            // 下载
            const link = document.createElement('a');
            link.download = `test_${data.testName||'result'}_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // ─── 对外接口 ──────────────────────────────────────────────
        function shareResult() {
            if (!resultData) return;
            shareResultWithData(resultData);
        }

        // ─── 键盘快捷键 ──────────────────────────────────────────────
        document.addEventListener('keydown', e => {
            const quizPage = document.getElementById('page-quiz');
            if (!quizPage.classList.contains('active')) return;
            if (e.key >= '1' && e.key <= '9') {
                const idx = parseInt(e.key) - 1;
                const items = document.querySelectorAll('.option-item');
                if (items[idx]) items[idx].click();
            }
            if (e.key === 'Enter' && !document.getElementById('nextBtn').disabled) {
                if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null; }
                nextQuestion();
            }
            if (e.key === 'Backspace' && currentQ > 0) { prevQuestion(); }
        });

        renderHome();
    </script>
</body>
</html>
