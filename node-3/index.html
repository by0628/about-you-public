<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>认知棱镜 · 内在光谱</title>
<style>
:root {
  --bg: #f5f3ee;
  --bg-card: #ffffff;
  --bg-glass: rgba(255,255,255,0.6);
  --text-main: #2d2a24;
  --text-sub: #7b7466;
  --border: #e8e3dc;
  --primary: #7b8d9e;
  --primary-light: #a0b0c0;
  --accent: #c9b18a;
  --shadow: 0 10px 40px rgba(123,141,158,0.08);
  --radius-lg: 32px;
  --radius-md: 24px;
  --radius-sm: 16px;
  --transition: 0.4s cubic-bezier(.4,0,.2,1);
}
html.dark-mode {
  --bg: #1a1a2e;
  --bg-card: #24243e;
  --bg-glass: rgba(36,36,62,0.6);
  --text-main: #eae6e0;
  --text-sub: #9b9588;
  --border: #33334d;
  --primary: #9bb0c0;
  --primary-light: #7b8d9e;
  --accent: #c9b18a;
  --shadow: 0 10px 40px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter','PingFang SC','Noto Sans SC',system-ui,sans-serif;
  background: var(--bg); color: var(--text-main);
  min-height:100vh; padding:24px;
  transition: background var(--transition), color var(--transition);
}
.app-container {
  max-width:860px; margin:0 auto;
  background: var(--bg-glass); backdrop-filter: blur(20px);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  padding:36px 40px 60px; position:relative;
  border:1px solid var(--border); transition: all var(--transition);
}
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:36px; }
.logo { font-size:24px; font-weight:800; display:flex; align-items:center; gap:10px; }
.logo svg { width:32px; height:32px; stroke: var(--primary); stroke-width:2; fill:none; }
.header-actions { display:flex; gap:10px; }
.theme-toggle {
  background: var(--bg-card); border:1px solid var(--border);
  color:var(--text-sub); width:44px; height:44px; border-radius:50%;
  cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
  transition: var(--transition); box-shadow: var(--shadow);
}
.theme-toggle:hover { transform:translateY(-2px); color:var(--primary); }
.theme-toggle svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; }
.btn {
  padding:12px 26px; border-radius:999px; font-weight:600; font-size:15px;
  border:none; cursor:pointer; transition: var(--transition);
  display:inline-flex; align-items:center; gap:8px;
}
.btn-primary {
  background: linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff; box-shadow: 0 8px 20px rgba(123,141,158,0.3);
}
.btn-primary:hover { transform:translateY(-2px); }
.btn-outline { background:transparent; border:2px solid var(--border); color:var(--text-sub); }
.btn-outline:hover { background:var(--bg); border-color:var(--primary-light); }
.btn-full { width:100%; justify-content:center; }
.page { display:none; animation: fadeIn .5s ease forwards; }
.page.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

.home-title { font-size:36px; font-weight:800; line-height:1.2; margin-bottom:8px; }
.home-sub { font-size:16px; color:var(--text-sub); margin:16px 0 32px; border-left:4px solid var(--accent); padding-left:20px; }
.test-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
}
.test-card {
  background:var(--bg-card); border-radius:var(--radius-md); padding:24px 20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.03); transition:var(--transition);
  cursor:pointer; border:1px solid var(--border); position:relative; overflow:hidden;
}
.test-card:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(123,141,158,0.1); border-color:var(--primary-light); }
.test-card .icon { width:40px; height:40px; margin-bottom:8px; stroke:var(--primary); stroke-width:1.8; fill:none; }
.test-card h3 { font-size:16px; font-weight:700; margin-bottom:4px; }
.test-card p { color:var(--text-sub); font-size:12px; line-height:1.4; }
.test-card .badge { font-size:11px; background:var(--bg); border-radius:12px; padding:2px 10px; display:inline-block; margin-top:6px; color:var(--text-sub); }

.progress-bar-container { width:100%; height:6px; background:var(--bg); border-radius:999px; margin-bottom:24px; overflow:hidden; border:1px solid var(--border); }
.progress-bar { height:100%; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:999px; transition:width .4s ease; width:0%; }
.question-box { background:var(--bg-card); border-radius:var(--radius-md); padding:36px; box-shadow:0 4px 20px rgba(0,0,0,0.03); border:1px solid var(--border); }
.q-counter { font-size:13px; color:var(--text-sub); margin-bottom:12px; display:block; }
.q-text { font-size:20px; font-weight:600; line-height:1.6; }
.options-container { margin-top:24px; display:flex; flex-direction:column; gap:10px; }
.option-item {
  padding:14px 18px; border-radius:var(--radius-sm); border:2px solid var(--border);
  cursor:pointer; transition:var(--transition); background:var(--bg);
  display:flex; align-items:center; gap:12px; color:var(--text-main);
}
.option-item:hover { border-color:var(--primary-light); background:var(--bg-card); transform:translateX(4px); }
.option-item.selected { border-color:var(--primary); background:linear-gradient(135deg,rgba(123,141,158,0.1),rgba(201,177,138,0.05)); }
.option-item .key-hint { font-size:11px; color:var(--text-sub); background:var(--bg-card); border:1px solid var(--border); border-radius:4px; padding:2px 6px; margin-left:auto; }

.result-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:48px 40px; box-shadow:0 20px 60px rgba(123,141,158,0.12); text-align:center; border:1px solid var(--border); }
.result-icon { width:72px; height:72px; margin:0 auto 12px; stroke:var(--primary); stroke-width:1.5; fill:none; }
.result-type { font-size:32px; font-weight:800; background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.result-desc { font-size:15px; color:var(--text-sub); line-height:1.8; max-width:600px; margin:16px auto 0; }
.dimension-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:24px; }
.dim-tag { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--text-main); text-align:left; }
.dim-tag .dim-name { font-weight:700; color:var(--primary); display:block; margin-bottom:2px; }

.modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:100; align-items:center; justify-content:center; }
.modal-mask.show { display:flex; animation:fadeIn .3s ease; }
.modal { background:var(--bg-card); border-radius:var(--radius-md); padding:28px; max-width:500px; width:90%; max-height:70vh; overflow-y:auto; border:1px solid var(--border); box-shadow:var(--shadow); }
.modal h3 { margin-bottom:16px; font-size:18px; }
.history-item { padding:12px; border-bottom:1px solid var(--border); font-size:14px; }
.history-item:last-child { border-bottom:none; }
.history-item .hist-type { font-weight:700; color:var(--primary); }
.history-item .hist-time { font-size:11px; color:var(--text-sub); float:right; }

@media(max-width:640px) { .app-container{padding:20px; border-radius:24px;} .home-title{font-size:28px;} .question-box{padding:24px;} }
</style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 32 32"><path d="M16 4 L16 28 M4 16 L28 16 M8 8 L24 24 M24 8 L8 24" stroke-linecap="round"/></svg>
      <span>认知棱镜</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" onclick="showHistory()" title="历史记录">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2 L8 6 M16 2 L16 6 M3 10 L21 10"/></svg>
      </button>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切换主题">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2 L12 4 M12 20 L12 22 M4 12 L2 12 M22 12 L20 12 M5.6 5.6 L4.2 4.2 M18.4 18.4 L19.8 19.8 M18.4 5.6 L19.8 4.2 M5.6 18.4 L4.2 19.8"/></svg>
      </button>
    </div>
  </header>

  <div class="page active" id="page-home">
    <h1 class="home-title">认知 · 情感 · 行为</h1>
    <div class="home-sub">基于心理学原理的自我探索工具，所有数据仅保存在本地，不传输、不追踪。</div>
    <div class="test-grid" id="testGrid"></div>
  </div>

  <div class="page" id="page-quiz">
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="question-box">
      <span class="q-counter" id="qCounter"></span>
      <div class="q-text" id="qText"></div>
      <div class="options-container" id="optionsContainer"></div>
    </div>
    <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="prevQuestion()" id="prevBtn" style="display:none;">← 上一题</button>
      <button class="btn btn-outline" onclick="goHome()" id="homeBtn">← 返回</button>
      <button class="btn btn-primary btn-full" id="nextBtn" onclick="nextQuestion()" disabled>确认选择</button>
    </div>
  </div>

  <div class="page" id="page-result">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-type" id="resultType"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="dimension-grid" id="dimGrid"></div>
    </div>
    <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary btn-full" onclick="shareResult()">📸 生成分享图</button>
      <button class="btn btn-outline" onclick="goHome()">返回首页</button>
      <button class="btn btn-outline" onclick="restartCurrentTest()">重新测试</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="historyModal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal">
    <h3>📋 历史记录</h3>
    <div id="historyList"><p style="color:var(--text-sub);font-size:14px;">暂无记录</p></div>
  </div>
</div>

<canvas id="shareCanvas" width="800" height="1000" style="display:none;"></canvas>

<script>
// 主题
(function(){
  const t = localStorage.getItem('theme');
  if(t==='dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)){
    document.getElementById('html-root').classList.add('dark-mode');
  }
})();
function toggleTheme(){
  const html = document.getElementById('html-root');
  html.classList.toggle('dark-mode');
  localStorage.setItem('theme', html.classList.contains('dark-mode') ? 'dark' : 'light');
}

// 测试数据（完整保留你上一版的5个测试）
const TESTS = [
  {
    id: 'sbti', name: 'SBTI 性格侧写',
    icon: `<svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="3" stroke="currentColor"/><path d="M12 15 L28 15 M12 20 L24 20 M12 25 L20 25" stroke="currentColor"/></svg>`,
    desc: '基于5模型15维度的深度自我观察，27种原型。',
    questions: [
      { id:'S1', text:'当别人夸你"你真厉害"时，你第一反应是？', options:['觉得对方在客气','内心暗喜但表面淡定','直接回"谢谢，我也觉得"'] },
      { id:'S2', text:'深夜独处时，你对自己的评价通常是？', options:['比较满意，知道自己在做什么','有点模糊，不太确定自己到底要什么','经常反思，但结论总在变'] },
      { id:'S3', text:'你内心最看重的东西是？', options:['自由——不被定义','真实——不装','稳定——可预期'] },
      { id:'E1', text:'在一段关系里，你多久会确认一次"对方是不是还在乎我"？', options:['几乎不，安全感自己给','偶尔，通过小事观察','经常，需要反复确认'] },
      { id:'E2', text:'你表达情绪的方式更接近？', options:['直接说出来','写下来或画出来','不表达，等对方自己发现'] },
      { id:'E3', text:'当朋友深夜崩溃找你倾诉，你会？', options:['陪着，但不一定给建议','立刻给方案、想办法解决','有点慌，不知道该不该接'] },
      { id:'A1', text:'你对"世界会好吗"这个问题的真实想法是？', options:['不好说，但我选择乐观','大概率不会，但跟我没关系','会，但需要每个人努力'] },
      { id:'A2', text:'面对规则，你的态度是？', options:['看情况，能绕就绕','大部分遵守，但保留质疑','规则就是规则，尽量不破'] },
      { id:'A3', text:'你的人生意义感主要来自？', options:['创造东西','被需要','体验本身'] },
      { id:'Ac1', text:'开始做一件事之前，你会？', options:['想清楚再动','边做边想','先做一小步再说'] },
      { id:'Ac2', text:'做决定时你更依赖？', options:['逻辑分析','直觉','别人的经验'] },
      { id:'Ac3', text:'你的执行力在什么时候最强？', options:['有deadline压着','心情好的时候','没人管我的时候'] },
      { id:'So1', text:'聚会中你的状态是？', options:['主动热场，认识所有人','只跟认识的人聊','躲在角落等结束'] },
      { id:'So2', text:'别人说"你变了"，你的反应是？', options:['"是你没跟上我"','"可能吧"','"我哪里变了？"'] },
      { id:'So3', text:'你在社交中最大的消耗来自？', options:['维持表面客气','怕冷场','不知道该说什么'] },
      { id:'DRUNK', text:'如果此刻有一杯酒递到你面前，你会？', options:['接过来喝掉','说"我不喝"','问"什么酒？"再决定'], hidden:true },
      { id:'S1b', text:'你觉得自己"值得被爱"吗？', options:['值得，无条件','值得，但要看表现','不确定'] },
      { id:'S2b', text:'当你做了一件蠢事，你多久能翻篇？', options:['当场翻篇','几天','很久，反复想'] },
      { id:'S3b', text:'你理想中的"成功"是？', options:['做自己热爱的事','有选择权','被认可'] },
      { id:'E1b', text:'你更容易因为什么而哭？', options:['被理解','被误解','感动'] },
      { id:'E2b', text:'你会在朋友圈发负面情绪吗？', options:['从不','偶尔加密','经常'] },
      { id:'E3b', text:'你理想的关系状态是？', options:['彼此独立但有连接','形影不离','互不打扰'] },
      { id:'A1b', text:'你对"努力就一定有回报"的看法是？', options:['信','不信','看运气'] },
      { id:'A2b', text:'你更倾向哪种学习方式？', options:['自己摸索','有人带','看教程'] },
      { id:'A3b', text:'你的人生座右铭更接近？', options:['尽人事听天命','车到山前必有路','不打无准备之仗'] },
      { id:'Ac1b', text:'你拖延的最大原因是？', options:['完美主义','没动力','不知道从哪开始'] },
      { id:'Ac2b', text:'你更喜欢哪种工作模式？', options:['一个人干','跟人合作','看情况'] },
      { id:'Ac3b', text:'你完成任务后的第一反应是？', options:['松一口气','立刻想下一个','复盘哪里可以更好'] },
      { id:'So1b', text:'你在陌生人群中最想做的是？', options:['观察','找人搭话','假装看手机'] },
      { id:'So2b', text:'别人眼中你的社交形象是？', options:['高冷','随和','有趣'] },
      { id:'So3b', text:'你主动联系别人的频率是？', options:['经常','偶尔','几乎不'] },
    ],
    getResult: function(ansList) {
      const dimKeys = ['S1','S2','S3','E1','E2','E3','A1','A2','A3','Ac1','Ac2','Ac3','So1','So2','So3'];
      const dims = {};
      dimKeys.forEach(k=>{ const a=ansList.find(x=>x.qid===k); dims[k]=a?(a.value===0?'L':a.value===1?'M':'H'):'?'; });
      const vector = dimKeys.map(k=>dims[k]).join('');
      const drunk = ansList.some(a=>a.qid==='DRUNK'&&a.value===0);
      const ARCHETYPES = {
        'LLLLLLLLLLLLLLL':{name:'静水',desc:'你像深水，表面平静，底下有自己的节奏。不争不抢，但谁也搅不动你。'},
        'MMMMMMMMMMMMMMM':{name:'回声',desc:'你善于接收和反射，是很好的倾听者。但偶尔会困惑：哪个声音才是自己的？'},
        'HHHHHHHHHHHHHHH':{name:'焰心',desc:'你燃烧得很快很亮。热情是你的燃料，但记得留一点给自己。'},
        'default':{name:'探索者原型',desc:'你的内在组合独特且充满变化，难以简单归类。你始终在按照自己的秩序延伸成长。'}
      };
      let arch;
      if(drunk) arch={name:'微醺者',desc:'你选择了那杯酒。你允许自己偶尔失控，这本身就是一种勇气。'};
      else if(vector==='HHHHHHHHHHHHHHH') arch={name:'全开',desc:'所有维度均达顶峰。你是那种"要么不做，要么做到极致"的行动派。'};
      else arch=ARCHETYPES[vector]||ARCHETYPES['default'];
      return { type:arch.name, description:arch.desc, dims };
    }
  },
  {
    id:'mbti', name:'MBTI 性格测试',
    icon:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" stroke="currentColor"/><path d="M6 20 L34 20 M20 6 L20 34" stroke="currentColor"/><circle cx="20" cy="20" r="4" stroke="currentColor"/></svg>`,
    desc:'从精力、认知、判断、生活四个维度深度剖析16型人格。',
    questions:[
      {dim:'EI',text:'周末休息时，你通常如何恢复精力？',options:['与朋友聚会或参加户外活动','独自留在房间看书、刷剧或休息']},
      {dim:'EI',text:'在社交派对或新环境中，你往往：',options:['主动认识新朋友，成为人群焦点','保持低调，等别人主动找你交谈']},
      {dim:'EI',text:'高强度工作了一整天后，你更想：',options:['找朋友喝一杯或畅聊一番','安静地待着，不被打扰']},
      {dim:'EI',text:'在会议或讨论中，你通常：',options:['边想边说，通过表达整理思路','深思熟虑后再开口发表观点']},
      {dim:'EI',text:'当你感到疲惫时，你更倾向于：',options:['去热闹的地方充电','找个安静角落独处']},
      {dim:'EI',text:'别人对你的印象往往是：',options:['外向开朗、好相处','内敛沉稳、有距离感']},
      {dim:'SN',text:'学习或接触新事物时，你更倾向于：',options:['关注具体事实、数据和现实细节','关注整体概念、未来趋势与可能性']},
      {dim:'SN',text:'你更信任哪种信息？',options:['亲自体验过的经验与现实依据','直觉灵感以及事物背后的潜在联系']},
      {dim:'SN',text:'描述一件事情时，你习惯：',options:['按时间顺序讲清楚过程与细节','直接总结核心要点和象征意义']},
      {dim:'SN',text:'你对未来的态度更偏向：',options:['立足当下，脚踏实地做好眼前事','充满想象，经常构思长远的愿景']},
      {dim:'SN',text:'你更擅长观察：',options:['细微变化与具体细节','整体模式和抽象联系']},
      {dim:'SN',text:'阅读时你更偏爱：',options:['纪实报道、实用指南','科幻小说、哲学思辨']},
      {dim:'TF',text:'做重大决策时，你首要考虑的是：',options:['逻辑客观性与规则公平','相关人员的感受与人情和谐']},

// 全局状态
let activeTest=null, currentQ=0, answers=[], resultData=null, selectedValue=null, autoAdvanceTimer=null;

function renderHome(){
  document.getElementById('testGrid').innerHTML=TESTS.map(t=>`
    <div class="test-card" onclick="startTest('${t.id}')">
      <div class="icon">${t.icon}</div>
      <h3>${t.name}</h3>
      <p>${t.desc}</p>
      <span class="badge">${t.questions.length} 题</span>
    </div>`).join('');
  showPage('page-home');
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){
  activeTest=null; currentQ=0; answers=[]; resultData=null; selectedValue=null;
  if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;}
  renderHome();
}

function startTest(testId){
  activeTest=TESTS.find(t=>t.id===testId);
  if(!activeTest) return;
  currentQ=0; answers=[]; resultData=null; selectedValue=null;
  showPage('page-quiz');
  updateNavButtons();
  renderQuestion();
}

function restartCurrentTest(){
  if(activeTest) startTest(activeTest.id);
  else goHome();
}

function updateNavButtons(){
  const prevBtn=document.getElementById('prevBtn');
  const homeBtn=document.getElementById('homeBtn');
  if(currentQ>0){ prevBtn.style.display=''; homeBtn.style.display='none'; }
  else{ prevBtn.style.display='none'; homeBtn.style.display=''; }
}

function renderQuestion(){
  const q=activeTest.questions[currentQ];
  document.getElementById('qCounter').textContent=`第 ${currentQ+1} / ${activeTest.questions.length} 题`;
  document.getElementById('progressBar').style.width=`${currentQ/activeTest.questions.length*100}%`;
  document.getElementById('qText').textContent=q.text;
  const container=document.getElementById('optionsContainer');
  container.innerHTML='';
  q.options.forEach((opt,i)=>{
    const div=document.createElement('div');
    div.className='option-item';
    // 回填已选答案
    const isSelected = answers[currentQ] && answers[currentQ].value===i;
    if(isSelected) div.classList.add('selected');
    div.innerHTML=`<span>${String.fromCharCode(65+i)}. ${opt}</span><span class="key-hint">${i+1}</span>`;
    div.onclick=()=>selectOption(div,i);
    container.appendChild(div);
  });
  selectedValue = answers[currentQ] ? answers[currentQ].value : null;
  document.getElementById('nextBtn').disabled = selectedValue===null;
  updateNavButtons();
}

function selectOption(el,val){
  if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;}
  document.querySelectorAll('.option-item').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  selectedValue=val;
  document.getElementById('nextBtn').disabled=false;

  // ★ 自动跳转：最后一题不自动跳，其他等 600ms
  if(currentQ < activeTest.questions.length-1){
    autoAdvanceTimer = setTimeout(()=>{
      nextQuestion();
    }, 600);
  }
}

function prevQuestion(){
  if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;}
  if(currentQ<=0) return;
  currentQ--;
  selectedValue=null;
  renderQuestion();
}

function nextQuestion(){
  if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;}
  if(selectedValue===null) return;
  const q=activeTest.questions[currentQ];
  const qid=q.id||`q${currentQ}`;
  answers[currentQ]={qid,value:selectedValue};
  currentQ++;
  selectedValue=null;
  if(currentQ>=activeTest.questions.length){ finishTest(); return; }
  renderQuestion();
}

function finishTest(){
  const result=activeTest.getResult(answers);
  result.testName=activeTest.name;
  result.testIcon=activeTest.icon;
  resultData=result;
  showPage('page-result');
  document.getElementById('progressBar').style.width='100%';
  document.getElementById('resultIcon').innerHTML=`<svg viewBox="0 0 80 80" stroke="var(--primary)" stroke-width="2" fill="none"><circle cx="40" cy="40" r="30"/><path d="M20 40 L60 40 M40 20 L40 60"/></svg>`;
  document.getElementById('resultType').textContent=result.type;
  document.getElementById('resultDesc').textContent=result.description||'';
  const grid=document.getElementById('dimGrid');
  grid.innerHTML='';
  if(result.dims&&Object.keys(result.dims).length>0){
    grid.style.display='grid';
    Object.entries(result.dims).forEach(([k,v])=>{
      const div=document.createElement('div');
      div.className='dim-tag';
      div.innerHTML=`<span class="dim-name">${k}</span>${v}`;
      grid.appendChild(div);
    });
  } else grid.style.display='none';
  saveHistory(result);
}

function saveHistory(data){
  const key='aurevny_multi_test_history';
  const hist=JSON.parse(localStorage.getItem(key)||'[]');
  hist.unshift({testName:data.testName,testIcon:data.testIcon,type:data.type,dims:data.dims||null,date:new Date().toLocaleString('zh-CN')});
  localStorage.setItem(key,JSON.stringify(hist.slice(0,30)));
}

function showHistory(){
  const key='aurevny_multi_test_history';
  const hist=JSON.parse(localStorage.getItem(key)||'[]');
  const list=document.getElementById('historyList');
  if(hist.length===0){ list.innerHTML='<p style="color:var(--text-sub);font-size:14px;">暂无记录</p>'; }
  else{
    list.innerHTML=hist.map(h=>`<div class="history-item"><span class="hist-type">${h.testName} · ${h.type}</span><span class="hist-time">${h.date}</span>${h.dims?`<br><small style="color:var(--text-sub);">${Object.entries(h.dims).map(([k,v])=>`${k}:${v}`).join(' · ')}</small>`:''}</div>`).join('');
  }
  document.getElementById('historyModal').classList.add('show');
}

function drawRoundRect(ctx,x,y,w,h,r){
  if(r>w/2)r=w/2; if(r>h/2)r=h/2;
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
}
function shareResult(){
  if(!resultData) return;
  const canvas=document.getElementById('shareCanvas');
  const ctx=canvas.getContext('2d');
  const isDark=document.getElementById('html-root').classList.contains('dark-mode');
  ctx.clearRect(0,0,800,1000);
  ctx.fillStyle=isDark?'#1a1a2e':'#f5f3ee'; ctx.fillRect(0,0,800,1000);
  ctx.fillStyle=isDark?'#24243e':'#ffffff'; ctx.beginPath(); drawRoundRect(ctx,40,40,720,920,32); ctx.fill();
  ctx.fillStyle=isDark?'#c9b18a':'#7b8d9e'; ctx.font='bold 36px sans-serif'; ctx.textAlign='center';
  ctx.fillText('认知棱镜 · '+resultData.testName,400,120);
  ctx.strokeStyle=isDark?'#c9b18a':'#7b8d9e'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(400,260,60,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(360,260); ctx.lineTo(440,260); ctx.moveTo(400,220); ctx.lineTo(400,300); ctx.stroke();
  ctx.fillStyle=isDark?'#eae6e0':'#2d2a24'; ctx.font='bold 44px sans-serif'; ctx.fillText(resultData.type,400,420);
  ctx.font='22px sans-serif'; ctx.fillStyle=isDark?'#9b9588':'#7b7466';
  const text=resultData.description||''; let line='',startY=490;
  for(let n=0;n<text.length;n++){
    let testLine=line+text[n];
    if(ctx.measureText(testLine).width>600&&n>0){ ctx.fillText(line,400,startY); line=text[n]; startY+=36; }
    else line=testLine;
  }
  ctx.fillText(line,400,startY);
  if(resultData.dims&&Object.keys(resultData.dims).length>0){
    ctx.font='16px monospace'; ctx.fillStyle=isDark?'#c9b18a':'#7b8d9e';
    ctx.fillText(Object.entries(resultData.dims).map(([k,v])=>`${k}:${v}`).join('  '),400,680);
  }
  ctx.font='14px sans-serif'; ctx.fillStyle=isDark?'#555':'#bbb';
  ctx.fillText('Local Only · No Telemetry',400,900); ctx.fillText(new Date().toLocaleString('zh-CN'),400,930);
  const link=document.createElement('a');
  link.download=`test_${resultData.testName||'result'}_${Date.now()}.png`;
  link.href=canvas.toDataURL('image/png'); link.click();
}

// 键盘
document.addEventListener('keydown',e=>{
  const quizPage=document.getElementById('page-quiz');
  if(!quizPage.classList.contains('active')) return;
  if(e.key>='1'&&e.key<='9'){
    const idx=parseInt(e.key)-1;
    const items=document.querySelectorAll('.option-item');
    if(items[idx]) items[idx].click();
  }
  if(e.key==='Enter'&&!document.getElementById('nextBtn').disabled){
    if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;}
    nextQuestion();
  }
  if(e.key==='Backspace'&&currentQ>0){
    prevQuestion();
  }
});

renderHome();
</script>
