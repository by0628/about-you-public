<!DOCTYPE html>
<html lang="zh-Hant" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky · Aurevny.Lab</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noto-serif-tc/1.0.0/static/noto-serif-tc.css">
<style>
:root {
  --bg-cream: #FDFBF7；
  --card-white: #FFFFFF;
  --text-main: #5D5A55;
  --text-muted: #8A8278;
  --accent-pink: #C4A89A;
  --accent-blue: #B0C4D8;
  --accent-green: #A8C0B8;
  --line: #E5DFD7;
  --shadow: 0 12px 48px rgba(90, 80, 70, 0.08);
  --shadow-hover: 0 16px 56px rgba(90, 80, 70, 0.14);
  --toggle-bg: #f0ebe5;
  --toggle-dot: #C4A89A;
}
html.dark-mode {
  --bg-cream: #191613;
  --card-white: #2A2622;
  --text-main: #D6CFC8;
  --text-muted: #9E958A;
  --accent-pink: #D4B8A8;
  --accent-blue: #B8CDE0;
  --accent-green: #B0C8C0;
  --line: #3D3833;
  --shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
  --shadow-hover: 0 16px 56px rgba(0, 0, 0, 0.65);
  --toggle-bg: #3D3833;
  --toggle-dot: #D4B8A8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-cream);
  color: var(--text-main);
  font-family: "Noto Serif TC", "Songti TC", serif;
  letter-spacing: .04em;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  transition: background .45s ease, color .35s ease;
}
body {
  max-width: 680px;
  margin: 0 auto;
  padding: clamp(24px, 5vw, 40px) clamp(16px, 4vw, 24px) 60px;
  position: relative;
  z-index: 1;
}
#bgCanvas {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 0; pointer-events: none;
  opacity: 0.6;
}
.shell {
  background: var(--card-white);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: clamp(28px, 6vw, 44px) clamp(20px, 5vw, 36px);
  position: relative; z-index: 2;
  transition: background .45s ease;
}
/* 返回 */
.back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--text-muted);
  letter-spacing: .2em; text-decoration: none;
  border-bottom: 1px dotted var(--line);
  transition: color .3s, border-color .3s;
  margin-bottom: 20px;
}
.back:hover { color: var(--accent-pink); border-bottom-color: var(--accent-pink); }

/* 标题 */
.header { text-align: center; margin-bottom: clamp(24px, 5vw, 32px); }
.header .label {
  font-size: 10px; color: var(--text-muted);
  letter-spacing: .3em; text-transform: uppercase;
}
.header h1 {
  font-size: clamp(22px, 5.5vw, 30px);
  color: var(--accent-pink);
  letter-spacing: .18em;
  font-weight: 400;
  margin-top: 8px;
}
.header .sub {
  font-size: 12px; color: var(--text-muted);
  margin-top: 10px; line-height: 1.8;
  font-style: italic; opacity: .8;
}

/* 分隔 */
.divider {
  margin: 24px auto;
  width: 32px; height: 1px;
  background: var(--line);
}

/* 项目列表 */
.projects {
  display: flex; flex-direction: column; gap: 12px;
}
.project {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--bg-cream);
  text-decoration: none; color: var(--text-main);
  transition: all .35s cubic-bezier(.25,.8,.25,1);
  position: relative; overflow: hidden;
}
.project::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent-blue);
  opacity: 0; transition: opacity .35s ease;
}
.project:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-hover);
  border-color: rgba(176, 196, 216, .4);
}
.project:hover::before { opacity: 1; }
.project.empty {
  opacity: .3; pointer-events: none;
}
.project-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--card-white);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex: none;
  color: var(--accent-blue);
  transition: background .45s ease, border-color .45s ease;
}
.project-body { flex: 1; min-width: 0; }
.project-title {
  font-size: 14px; letter-spacing: .1em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.project-desc {
  font-size: 10.5px; color: var(--text-muted);
  margin-top: 2px; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.project-tag {
  flex: none; font-size: 8px; letter-spacing: .2em;
  padding: 3px 7px; border: 1px solid var(--line);
  color: var(--text-muted); border-radius: 4px;
}
.project-tag.live { color: var(--accent-blue); border-color: rgba(176,196,216,.5); }

/* 底部 */
.footer {
  margin-top: 32px; text-align: center;
  font-size: 10px; color: var(--text-muted);
  letter-spacing: .18em; line-height: 2;
}
.footer a {
  color: var(--accent-pink); text-decoration: none;
  border-bottom: 1px dotted var(--line);
}

/* 主题按钮 */
.ctrl-bar {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-bottom: 16px;
}
.ctrl-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--toggle-bg);
  color: var(--toggle-dot); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all .3s;
}
.ctrl-btn:hover { transform: rotate(10deg); border-color: var(--accent-pink); }

@media(max-width:520px) {
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="shell">
  <!-- 返回首页 -->
  <a class="back" href="../index.html">← 返回 Aurevny.Lab</a>

  <div class="ctrl-bar">
    <button class="ctrl-btn" onclick="toggleTheme()" aria-label="切換深色模式">🌙</button>
  </div>

  <!-- 标题 -->
  <div class="header">
    <div class="label">Node · 05</div>
    <h1>Sky · 天空</h1>
    <div class="sub">太陽從東到西，水面映著月光。<br>關於天光、時間與安靜的觀測。</div>
  </div>

  <div class="divider"></div>

  <!-- 项目列表 -->
  <div class="projects">

    <a class="project" href="./sky/" aria-label="Sky · 天空">
      <div class="project-icon">☀</div>
      <div class="project-body">
        <div class="project-title">Sky · 天空</div>
        <div class="project-desc">自動/手動切換時段，太陽月亮真實方位，水面夜間反射。</div>
      </div>
      <div class="project-tag live">Live</div>
    </a>

    <!-- 占位 02 -->
    <div class="project empty">
      <div class="project-icon">☁</div>
      <div class="project-body">
        <div class="project-title">—</div>
        <div class="project-desc">準備中</div>
      </div>
      <div class="project-tag">Soon</div>
    </div>

    <!-- 占位 03 -->
    <div class="project empty">
      <div class="project-icon">★</div>
      <div class="project-body">
        <div class="project-title">—</div>
        <div class="project-desc">準備中</div>
      </div>
      <div class="project-tag">Soon</div>
    </div>

    <!-- 占位 04 -->
    <div class="project empty">
      <div class="project-icon">✦</div>
      <div class="project-body">
        <div class="project-title">—</div>
        <div class="project-desc">準備中</div>
      </div>
      <div class="project-tag">Soon</div>
    </div>

  </div>

  <div class="footer">
    <a href="../index.html">Aurevny.Lab</a> · Node-5 · Sky Collection
  </div>
</div>

<script>
// ─── 主题 ───
function applyTheme() {
  const saved = localStorage.getItem('aurevny-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved === 'dark' || (saved === null && prefersDark);
  document.documentElement.classList.toggle('dark-mode', isDark);
  const btn = document.querySelector('.ctrl-btn');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.classList.toggle('dark-mode');
  const btn = document.querySelector('.ctrl-btn');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('aurevny-theme', isDark ? 'dark' : 'light');
}

// ─── 粒子背景（跟主页同款） ───
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];
  const COUNT = 28, MAX = 110;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function colors() {
    const d = document.documentElement.classList.contains('dark-mode');
    return d ? 'rgba(212,184,168,' : 'rgba(196,168,154,';
  }
  class P {
    constructor() {
      this.x = Math.random()*w; this.y = Math.random()*h;
      this.vx = (Math.random()-.5)*.2; this.vy = (Math.random()-.5)*.2;
      this.r = 1+Math.random()*2; this.a = .1+Math.random()*.3;
    }
    update() {
      this.x+=this.vx; this.y+=this.vy;
      if(this.x<0||this.x>w) this.vx*=-1;
      if(this.y<0||this.y>h) this.vy*=-1;
    }
    draw() {
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fillStyle = colors()+this.a+')'; ctx.fill();
    }
  }
  for(let i=0;i<COUNT;i++) particles.push(new P());

  function lines() {
    const c = colors();
    for(let i=0;i<particles.length;i++)
      for(let j=i+1;j<particles.length;j++) {
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<MAX) {
          ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle = c+(1-d/MAX)*.15+')'; ctx.lineWidth=.5; ctx.stroke();
        }
      }
  }
  function animate() {
    ctx.clearRect(0,0,w,h);
    for(const p of particles){p.update();p.draw();}
    lines();
    requestAnimationFrame(animate);
  }
  animate();
  new MutationObserver(()=>{}).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
})();

// ─── 初始化 ───
document.addEventListener('DOMContentLoaded', applyTheme);
</script>

</body>
</html>
